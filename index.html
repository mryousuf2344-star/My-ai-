<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .app {
      max-width: 800px;
      margin: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1 {
      text-align: center;
      padding: 20px;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      padding: 12px 16px;
      margin: 10px 0;
      border-radius: 12px;
      max-width: 75%;
    }

    .user {
      background: #dbeafe;
      margin-left: auto;
    }

    .ai {
      background: white;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      padding: 15px;
      gap: 10px;
      background: white;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>🤖 My AI</h1>

    <div id="chat"></div>

    <div class="input-area">
      <input id="message" placeholder="Ask My AI..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("message");
      const chat = document.getElementById("chat");
      const message = input.value.trim();

      if (!message) return;

      chat.innerHTML += `<div class="message user">${message}</div>`;
      input.value = "";

      chat.innerHTML += `<div class="message ai" id="loading">Thinking...</div>`;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        document.getElementById("loading").textContent =
          data.reply || "Something went wrong.";
      } catch (error) {
        document.getElementById("loading").textContent =
          "Connection error.";
      }
    }
  </script>
</body>
</html>
